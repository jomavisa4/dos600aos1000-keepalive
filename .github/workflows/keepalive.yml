name: keepalive

# Mantem o site "dos 600 aos 1000" acordado no Render (plano free).
#
# O Render free dorme apos ~15 min sem nenhuma requisicao; a proxima visita
# demora 30-60s pra acordar (cold start). Este workflow faz um ping leve a cada
# 5 minutos pra manter a instancia quente.
#
# Fica num repositorio PUBLICO de proposito: em repositorios privados o GitHub
# so da 2.000 minutos de Actions por mes, e um ping a cada 5 min gastaria ~8.640
# minutos. Em repositorio publico os minutos de Actions sao ilimitados.
#
# O job "heartbeat" faz um commit de 1 linha por dia: sem atividade no
# repositorio, o GitHub desativa workflows agendados depois de 60 dias.

on:
  schedule:
    - cron: "*/5 * * * *"   # ping a cada 5 min
    - cron: "0 6 * * *"     # heartbeat diario (mantem o repo "ativo")
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Acordar o site
        run: |
          for host in "https://dos600aos1000.onrender.com/api/config" "https://dos600aos1000.onrender.com/"; do
            code=$(curl -sS -o /dev/null --max-time 110 -w "%{http_code}" "$host" || echo "000")
            echo "ping $host -> $code"
          done

  heartbeat:
    if: github.event.schedule == '0 6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Marcar atividade do repositorio
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > heartbeat.txt
          git config user.name "keepalive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add heartbeat.txt
          git diff --staged --quiet || git commit -m "heartbeat $(date -u +%F)"
          git push
