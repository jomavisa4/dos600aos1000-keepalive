name: keepalive

# Mantem o site "dos 600 aos 1000" acordado no Render (plano free).
#
# O Render free dorme apos ~15 min sem nenhuma requisicao; a proxima visita
# demora 30-60s pra acordar (cold start).
#
# Estrategia: em vez de confiar num cron de "*/5" (o agendador do GitHub e
# impreciso e atrasa muito em frequencias altas — no teste rodou de 1 em 1 hora),
# um cron raro (a cada 2h) dispara UM job que fica ~5h30 pingando o site a cada
# 5 minutos por dentro. Como o job (5h30) dura bem mais que o intervalo do cron
# (2h), os jobs ficam sobrepostos: mesmo que um disparo do GitHub atrase ou seja
# pulado, continua existindo job cobrindo o periodo.
#
# Repositorio PUBLICO de proposito: em repo privado o GitHub so da 2.000 minutos
# de Actions por mes; em repo publico os minutos sao ilimitados (e um job longo
# como este gastaria muito).
#
# O job "heartbeat" faz um commit de 1 linha por dia: sem atividade no
# repositorio, o GitHub desativa workflows agendados depois de 60 dias.

on:
  schedule:
    - cron: "0 */2 * * *"   # a cada 2h: dispara o job longo
    - cron: "30 6 * * *"    # heartbeat diario (mantem o repo "ativo")
  workflow_dispatch:

permissions:
  contents: write

jobs:
  warm:
    # roda nos disparos de 2 em 2 horas e tambem no disparo manual
    if: github.event_name != 'schedule' || github.event.schedule == '0 */2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Pingar o site a cada 5 min por ~5h30
        run: |
          end=$((SECONDS + 330*60))
          while [ "$SECONDS" -lt "$end" ]; do
            code=$(curl -sS -o /dev/null --max-time 90 -w "%{http_code}" \
              "https://dos600aos1000.onrender.com/api/config" || echo "000")
            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) ping -> $code"
            sleep 300
          done
          echo "ciclo concluido"

  heartbeat:
    if: github.event.schedule == '30 6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Marcar atividade do repositorio
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > heartbeat.txt
          git config user.name "keepalive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add heartbeat.txt
          git diff --staged --quiet || git commit -m "heartbeat $(date -u +%F)"
          git push
